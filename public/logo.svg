<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Anchor Circle -->
  <circle cx="100" cy="85" r="45" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Anchor Shape -->
  <g transform="translate(100, 85)">
    <!-- Anchor Ring -->
    <circle cx="0" cy="-25" r="8" stroke="url(#logoGradient)" stroke-width="4" fill="none"/>
    
    <!-- Anchor Shaft -->
    <line x1="0" y1="-17" x2="0" y2="30" stroke="url(#logoGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Anchor Cross -->
    <line x1="-15" y1="-5" x2="15" y2="-5" stroke="url(#logoGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Anchor Flukes -->
    <path d="M -20 25 Q -20 30 -15 30 L 0 30 Q 0 30 0 25" stroke="url(#logoGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 20 25 Q 20 30 15 30 L 0 30 Q 0 30 0 25" stroke="url(#logoGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Ship Hull -->
    <path d="M -30 35 L -25 45 L 25 45 L 30 35 Z" fill="url(#logoGradient)" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#logoGradient)" text-anchor="middle">KALIMAS</text>
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="2">GROUP</text>
</svg>
